user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    types {
        image/avif avif;
        image/webp webp;
    }

    map $host $site_subdir {
        default "";
        "amanda.codebycarlos.dev"      "amanda-nobrega";
        "tais.codebycarlos.dev"        "tais-ferreira";
        "priscilla.codebycarlos.dev"   "priscilla-ribeiro";
        "isis.codebycarlos.dev"        "isis-orona";
        "lucas.codebycarlos.dev"       "lucas-borda";
        "mariana.codebycarlos.dev"     "mariana-silveira";
        "matheus.codebycarlos.dev"     "matheus-azevedo";
        "michelle.codebycarlos.dev"    "michelle-pires";        "camila-furtak.codebycarlos.dev"        "camila-furtak-copacabana";

    }

    server {
        listen 80 default_server;
        server_name _;

        charset utf-8;
        access_log /var/log/nginx/access.log;

        # Headers de seguranca (tambem repetidos em cada location por causa da semantica do Nginx)
        # add_header no server block sozinho NAO se propaga pras locations; tem que repetir.
        # Ver https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
        set $hsts "max-age=31536000; includeSubDomains";
        set $csp "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; form-action 'self' https:; object-src 'none'; base-uri 'self'";

        set $root_path /usr/share/nginx/html;
        if ($site_subdir != "") {
            set $root_path /usr/share/nginx/html/$site_subdir;
        }
        root $root_path;

        index index.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Strict-Transport-Security $hsts always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy $csp always;
        }

        # Cache imutavel 1 ano pra todos assets estaticos hasheados/AVIF/WebP
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|avif|webp|json|xml|txt)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security $hsts always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy $csp always;
            access_log off;
        }

        # HTML sempre revalida
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            add_header Strict-Transport-Security $hsts always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy $csp always;
        }

        # Gzip pra texto
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    }
}
