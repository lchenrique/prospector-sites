user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Mapear Host header para o diretorio do site
    # Default: landing page (raiz)
    map $host $site_dir {
        default "/";
        "~^amanda\.codebycarlos\.dev$"           "/amanda-nobrega/";
        "~^tais\.codebycarlos\.dev$"             "/tais-ferreira/";
        "~^priscilla\.codebycarlos\.dev$"        "/priscilla-ribeiro/";
        "~^isis\.codebycarlos\.dev$"             "/isis-orona/";
        "~^lucas\.codebycarlos\.dev$"            "/lucas-borda/";
        "~^mariana\.codebycarlos\.dev$"          "/mariana-silveira/";
        "~^matheus\.codebycarlos\.dev$"          "/matheus-azevedo/";
        "~^michelle\.codebycarlos\.dev$"         "/michelle-pires/";
    }

    server {
        listen 80;
        server_name _;

        # Logs
        access_log /var/log/nginx/access.log;

        # Serve arquivos da pasta raiz do nginx
        root /usr/share/nginx/html;

        # Mapear URL pro diretorio do site baseado no Host
        # Ex: https://amanda.codebycarlos.dev/ -> serve /usr/share/nginx/html/amanda-nobrega/
        location / {
            try_files $uri $uri/ $site_dir$uri $site_dir$uri/ =404;
        }

        # Servir index.html automaticamente
        index index.html;

        # Cache de assets estaticos
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
}
