user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Mapear Host header para o subdiretorio do site
    # Default: raiz (landing page)
    map $host $site_subdir {
        default "";
        "amanda.codebycarlos.dev"      "amanda-nobrega";
        "tais.codebycarlos.dev"        "tais-ferreira";
        "priscilla.codebycarlos.dev"   "priscilla-ribeiro";
        "isis.codebycarlos.dev"        "isis-orona";
        "lucas.codebycarlos.dev"       "lucas-borda";
        "mariana.codebycarlos.dev"     "mariana-silveira";
        "matheus.codebycarlos.dev"     "matheus-azevedo";
        "michelle.codebycarlos.dev"    "michelle-pires";
    }

    server {
        listen 80 default_server;
        server_name _;

        # Logs
        access_log /var/log/nginx/access.log;

        # Root dinamico baseado no Host header
        # Ex: amanda.codebycarlos.dev -> /usr/share/nginx/html/amanda-nobrega
        # Ex: codebycarlos.dev -> /usr/share/nginx/html
        set $root_path /usr/share/nginx/html;
        if ($site_subdir != "") {
            set $root_path /usr/share/nginx/html/$site_subdir;
        }
        root $root_path;

        # Servir index.html automaticamente
        index index.html;

        # Tentar arquivo direto, depois como dir, depois 404
        location / {
            try_files $uri $uri/ =404;
        }

        # Cache de assets estaticos
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
}
